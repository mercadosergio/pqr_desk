@let users = rxUsers.value();

<div class="list_header">
  <div>
    <p class="list_eyebrow">Bandeja de atención</p>
    <h2>Solicitudes</h2>
  </div>
  <span class="result_count">{{ filteredPqrs().length }} resultados</span>
</div>

<div class="filters_bar">
  <label>
    <span>Tipo</span>
    <select [value]="selectedType()" (change)="filterByType($event)">
      <option value="">Todos</option>
      @for (item of types; track item.value) {
        <option [value]="item.value">{{ item.label }}</option>
      }
    </select>
  </label>
  <label>
    <span>Prioridad</span>
    <select [value]="selectedPriority()" (change)="filterByPriority($event)">
      <option value="">Todas</option>
      @for (item of priorities; track item.value) {
        <option [value]="item.value">{{ item.label }}</option>
      }
    </select>
  </label>
  <label>
    <span>Estado</span>
    <select [value]="selectedStatus()" (change)="filterByStatus($event)">
      <option value="">Todos</option>
      @for (item of statuses; track item.value) {
        <option [value]="item.value">{{ item.label }}</option>
      }
    </select>
  </label>
  <button type="button" class="clear_filters" (click)="clearFilters()">Limpiar</button>
</div>

<div class="pqr_layout">
  @for (item of filteredPqrs(); track item.id) {
    <app-pqr-card [agents]="users ?? []" [pqr]="item"></app-pqr-card>
  }
  @if (filteredPqrs().length === 0) {
    <p class="empty_state">No hay solicitudes que coincidan con los filtros.</p>
  }
</div>
