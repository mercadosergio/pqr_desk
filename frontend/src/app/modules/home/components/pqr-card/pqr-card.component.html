@let pqrData = pqr();

<article class="pqr_card">
  <div class="pqr_accent" aria-hidden="true"></div>

  <div class="pqr_content">
    <div class="pqr_chips">
      <span class="pqr_type">Radicado #{{ pqrData.id }}</span>
      <span class="pqr_channel">{{ pqrData.channel }}</span>
    </div>
    <a [routerLink]="['/pqr', pqrData.id]">
      <h3>{{ pqrData.title }}</h3>
    </a>

    <div class="pqr_info">
      <span class="client_avatar" aria-hidden="true">
        {{ pqrData.client.name.charAt(0) }}{{ pqrData.client.last_name.charAt(0) }}
      </span>
      <span class="client_name">{{ `${pqrData.client.name} ${pqrData.client.last_name}` }}</span>
      <span class="info_separator" aria-hidden="true"></span>
      <span class="created_at">{{ pqrData.created_at | timeDistance }}</span>
    </div>
  </div>
  <div class="pqr_actions">
    <div class="field_control">
      <label for="priority-{{ pqrData.id }}">Prioridad</label>
      <div class="select_control">
        <span
          class="priority_indicator"
          [style.background-color]="getPriorityColor(getCurrentPriority())"
          aria-hidden="true"
        ></span>
        <select
          id="priority-{{ pqrData.id }}"
          [value]="getCurrentPriority()"
          (change)="onPriorityChange($event)"
        >
          @for (item of priorities; track $index) {
            <option [value]="item.value" [selected]="item.value === pqrData.priority">
              {{ item.label }}
            </option>
          }
        </select>
      </div>
    </div>
    <div class="field_control">
      <label for="status-{{ pqrData.id }}">Estado</label>
      <div class="select_control">
        <select id="status-{{ pqrData.id }}" (change)="changeStatus($event)">
          @for (item of statuses; track $index) {
            <option [value]="item.value" [selected]="item.value === pqrData.status">
              {{ item.label }}
            </option>
          }
        </select>
      </div>
    </div>
  </div>
</article>
