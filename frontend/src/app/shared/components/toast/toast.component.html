<div class="toast-container">
  @for (toast of toasts; track $index) {
    <div
      class="toast"
      [ngClass]="{
        'toast-success': toast.type === 'success',
        'toast-error': toast.type === 'error',
        'toast-warning': toast.type === 'warning',
      }"
    >
      <div class="toast-message">{{ toast.message }}</div>
    </div>
  }
</div>
