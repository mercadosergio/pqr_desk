<header class="header">
  <div class="header__container">
    <a class="brand" routerLink="/" aria-label="Inicio">
      <img src="/pqr-logo.jpeg" alt="" />
    </a>

    <nav class="nav" aria-label="Navegación principal">
      <a
        class="nav__link"
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <fa-icon [icon]="homeIcon"></fa-icon>
        <span>Inicio</span>
      </a>
    </nav>

    <a class="new-ticket" routerLink="/pqr/nuevo">
      <fa-icon [icon]="newPqrIcon"></fa-icon>
      <span>Nuevo</span>
    </a>
  </div>
</header>
